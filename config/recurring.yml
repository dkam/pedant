# Uptime checks run in development too, so bin/dev shows real monitors.
development: &uptime
  schedule_checks:
    class: Uptime::ScheduleChecksJob
    queue: checks
    schedule: every 15 seconds
  # While a monitor stays down, a reminder every remind_every (ADR 0013).
  send_alert_reminders:
    class: SendRemindersJob
    queue: alerts
    schedule: every 5 minutes
  sync_monitor_sources:
    class: Uptime::SyncSourcesJob
    schedule: every minute
  prune_checks:
    command: "Uptime::Check.prune"
    schedule: every day at 3:41am
  # Every check is a job, and the scheduler runs every 15 seconds; clear them hourly.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  <<: *uptime
  # Backchannel-logout mappings outlive their sessions on purpose (see
  # OidcSession#invalidate!); this sweeps them once they're expired.
  clear_expired_oidc_sessions:
    command: "OidcSession.cleanup_expired"
    schedule: every hour at minute 17
